name: GDAL Java Wrapper

on:
  push:
    branches: [ 'master', 'main', 'develop' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ 'master', 'main', 'develop' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 = older glibc, so the .so loads on more Linux distros
          - os: ubuntu-22.04
            sysname: Linux
            triplet: x64-linux
          - os: windows-latest
            sysname: Windows
            triplet: x64-windows-static-md
          - os: macos-latest
            sysname: Darwin
            triplet: arm64-osx
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_COMMIT: 4cb050be2cfa7a947cdd2dd1a70e24b17774c979
      
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Java JDK
        uses: actions/setup-java@v5.4.0
        with:
          java-version: '25'
          distribution: 'zulu'
          java-package: 'jdk'

      # ------------------------------------------------------------
      # BUILD TOOLS ONLY (libraries come from vcpkg)
      # ------------------------------------------------------------
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y swig ant ninja-build pkg-config \
            autoconf automake libtool curl zip unzip tar

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install swig ant ninja pkg-config autoconf automake libtool

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: choco install swig ant ninja -y --no-progress

      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # ------------------------------------------------------------
      # VCPKG: static dependencies
      # ------------------------------------------------------------
      - name: Bootstrap vcpkg (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          echo "vcpkg commit: $(git -C "$RUNNER_TEMP/vcpkg" rev-parse HEAD)"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"

      - name: Bootstrap vcpkg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $root = "$env:RUNNER_TEMP\vcpkg"
          git clone https://github.com/microsoft/vcpkg $root
          git -C $root checkout $env:VCPKG_COMMIT
          Write-Host "vcpkg commit: $(git -C $root rev-parse HEAD)"
          & "$root\bootstrap-vcpkg.bat" -disableMetrics
          $fwd = $root -replace '\\','/'
          $cache = "$env:RUNNER_TEMP\vcpkg-cache" -replace '\\','/'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_ROOT=$fwd" | Out-File -FilePath $env:GITHUB_ENV -Append
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-${{ matrix.triplet }}-${{ env.VCPKG_COMMIT }}
          restore-keys: vcpkg-${{ matrix.triplet }}-

      - name: Install dependencies (vcpkg)
        shell: bash
        run: |
          set -euo pipefail
          # Feature names can drift between vcpkg releases;
          # `vcpkg x-package-info netcdf-c` lists the current ones.
          "$VCPKG_ROOT/vcpkg" install --triplet ${{ matrix.triplet }} \
            zlib "sqlite3[core,rtree]" tiff \
            "proj[core,tiff]" \
            geos \
            "hdf5[core,zlib]" \
            "netcdf-c[core,netcdf-4]"

      # ------------------------------------------------------------
      # CONFIGURE GDAL
      # ------------------------------------------------------------
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail

          EXTRA_ARGS=()
          case "$RUNNER_OS" in
            Linux)
              LDF="-Wl,--exclude-libs,ALL -static-libstdc++ -static-libgcc"
              EXTRA_ARGS+=(
                "-DCMAKE_SHARED_LINKER_FLAGS=$LDF" "-DCMAKE_MODULE_LINKER_FLAGS=$LDF"
                "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON" '-DCMAKE_INSTALL_RPATH=$ORIGIN'
              )
              ;;
            macOS)
              EXTRA_ARGS+=(
                "-DCMAKE_OSX_DEPLOYMENT_TARGET=12.0"
                "-DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew;/usr/local"
                "-DCMAKE_BUILD_WITH_INSTALL_RPATH=ON" "-DCMAKE_INSTALL_RPATH=@loader_path"
                "-DSWIG_EXECUTABLE=$(command -v swig)"
                "-DANT=$(command -v ant)"
              )
              ;;
          esac

          cmake -B build -S . -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_JAVA_BINDINGS=ON \
            -DBUILD_PYTHON_BINDINGS=OFF \
            -DBUILD_CSHARP_BINDINGS=OFF \
            -DBUILD_APPS=OFF \
            -DBUILD_TESTING=OFF \
            \
            -DGDAL_USE_EXTERNAL_LIBS=OFF \
            -DGDAL_USE_ZLIB=ON \
            -DGDAL_USE_SQLITE3=ON \
            -DGDAL_USE_TIFF=ON \
            -DGDAL_USE_GEOTIFF_INTERNAL=ON \
            -DGDAL_USE_JSONC_INTERNAL=ON \
            -DGDAL_USE_GEOS=ON \
            -DGDAL_USE_HDF5=ON \
            -DGDAL_USE_NETCDF=ON \
            \
            -DGDAL_BUILD_OPTIONAL_DRIVERS=OFF \
            -DOGR_BUILD_OPTIONAL_DRIVERS=OFF \
            -DGDAL_ENABLE_DRIVER_HDF5=ON \
            -DGDAL_ENABLE_DRIVER_NETCDF=ON \
            -DGDAL_ENABLE_DRIVER_AAIGRID=ON \
            -DGDAL_ENABLE_DRIVER_XYZ=ON \
            -DOGR_ENABLE_DRIVER_OPENFILEGDB=ON \
            -DOGR_ENABLE_DRIVER_SHAPE=ON \
            -DOGR_ENABLE_DRIVER_GPKG=ON \
            -DOGR_ENABLE_DRIVER_CSV=ON \
            "${EXTRA_ARGS[@]}"
            
      - name: Show binding configuration
        shell: bash
        run: grep -iE 'BUILD_JAVA|BUILD_SHARED|SWIG_EXECUTABLE|JNI_|JAVA_|^ANT' build/CMakeCache.txt || true
        
      - name: Build
        shell: bash
        run: cmake --build build --config Release

      # ------------------------------------------------------------
      # COLLECT + VERIFY
      # ------------------------------------------------------------
      - name: Collect Java artifacts
        shell: bash
        run: |
          set -euo pipefail
          out="Java"
          mkdir -p "$out"

          # 1. The jar (versioned name -> fixed name)
          jar=$(find build/swig/java -maxdepth 3 -name 'gdal*.jar' \
                  ! -name '*-sources.jar' ! -name '*-javadoc.jar' | head -n1)
          if [ -z "$jar" ]; then
            echo "FAIL: no GDAL jar found. All jars in build tree:" >&2
            find build -name '*.jar' >&2 || true
            exit 1
          fi
          echo "Using $jar"
          cp "$jar" "$out/gdal.jar"

          # 2. The JNI library
          find build/swig/java \
            \( -name 'gdalalljni.dll' -o -name 'libgdalalljni.so' -o -name 'libgdalalljni.dylib' \) \
            -type f -exec cp {} "$out"/ \;

          # 3. The shared libgdal it links against
          case "$RUNNER_OS" in
            Linux)
              soname=$(readelf -d build/libgdal.so | sed -n 's/.*SONAME.*\[\(.*\)\]/\1/p')
              cp -L build/libgdal.so "$out/$soname" ;;
            macOS)
              name=$(basename "$(otool -D build/libgdal.dylib | tail -n1)")
              cp -L build/libgdal.dylib "$out/$name" ;;
            Windows)
              find build -maxdepth 2 -name 'gdal*.dll' -type f -exec cp {} "$out"/ \; ;;
          esac

          # 4. PROJ database
          cp "$VCPKG_ROOT/installed/${{ matrix.triplet }}/share/proj/proj.db" "$out"/
          ls -la "$out"

      - name: Verify native libs are self-contained
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              for lib in Java/libgdalalljni.so Java/libgdal.so.*; do
                echo "== $lib"; ldd "$lib"
                if ldd "$lib" | grep '=>' \
                   | grep -vE 'linux-vdso|ld-linux|libc\.so|libm\.so|libdl\.so|libpthread\.so|librt\.so|libgdal\.so'; then
                  echo "FAIL: unexpected shared dependencies in $lib" >&2; exit 1
                fi
              done ;;
            macOS)
              for lib in Java/libgdalalljni.dylib Java/libgdal*.dylib; do
                echo "== $lib"; otool -L "$lib"
                if otool -L "$lib" | tail -n +2 \
                   | grep -vE '^\s*(/usr/lib/|/System/|@rpath/libgdal)'; then
                  echo "FAIL: unexpected shared dependencies in $lib" >&2; exit 1
                fi
              done ;;
            Windows)
              for lib in Java/*.dll; do
                echo "== $lib"; dumpbin //dependents "$lib"
              done ;;
          esac

      - name: Upload per-OS Java artifact
        uses: actions/upload-artifact@v7
        with:
          name: GDAL-Java-${{ matrix.sysname }}
          path: Java
          retention-days: 1
          
  # ------------------------------------------------------------
  # MERGE JOB
  # ------------------------------------------------------------
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      - name: Download per-OS artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: GDAL-Java-*
          path: staging

      - name: Assemble unified Java tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Java/proj

          first=$(ls -d staging/GDAL-Java-*/ | head -n1)
          cp "${first}gdal.jar" Java/gdal.jar
          cp "${first}proj.db"  Java/proj/proj.db     # platform independent

          for d in staging/GDAL-Java-*/; do
            sysname=$(basename "$d" | sed 's/^GDAL-Java-//')
            mkdir -p "Java/${sysname}"
            find "$d" \
              \( -name 'gdalalljni.dll' -o -name 'libgdalalljni.so' -o -name 'libgdalalljni.dylib' \
                 -o -name 'libgdal.so.*' -o -name 'libgdal*.dylib' -o -name 'gdal*.dll' \) \
                 -type f -exec cp {} "Java/${sysname}"/ \;
          done
          find Java -type f

      - name: Upload unified GDAL Java artifact
        uses: actions/upload-artifact@v7
        with:
          name: GDAL-Java
          path: Java
